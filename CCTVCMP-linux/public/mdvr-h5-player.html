<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Video</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font: 12px/1.4 system-ui, sans-serif;
    }
    #cmsv6flash {
      width: 100%;
      height: 100%;
      background: #000;
    }
    /* Cmsv6 uses object-fit:fill (stretches). contain = fit by longer side, no crop. */
    video, canvas,
    #cmsv6flash video, #cmsv6flash canvas,
    :fullscreen video, :fullscreen canvas,
    :-webkit-full-screen video, :-webkit-full-screen canvas {
      object-fit: contain !important;
    }
    :fullscreen, :-webkit-full-screen {
      background: #000 !important;
    }
    #status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
      background: #0a0a0a;
      z-index: 2;
    }
    #status[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="status">Loading player…</div>
  <div id="cmsv6flash"></div>
  <script>
    (function () {
      function qp(name) {
        var search = location.search.replace(/^\?/, "");
        if (!search) return "";
        var parts = search.split("&");
        for (var i = 0; i < parts.length; i++) {
          var kv = parts[i].split("=");
          if (decodeURIComponent(kv[0]) === name) {
            return decodeURIComponent((kv[1] || "").replace(/\+/g, " "));
          }
        }
        return "";
      }

      function setStatus(msg) {
        var el = document.getElementById("status");
        if (!msg) {
          el.hidden = true;
          el.textContent = "";
          return;
        }
        el.hidden = false;
        el.textContent = msg;
      }

      function loadScript(src) {
        return new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          s.src = src;
          s.async = false;
          s.onload = function () { resolve(); };
          s.onerror = function () { reject(new Error("Failed to load " + src)); };
          document.head.appendChild(s);
        });
      }

      function parseWsEndpoint(wsUrl) {
        try {
          // URL() accepts http(s); map ws→http for parsing only.
          var u = new URL(wsUrl.replace(/^ws/i, "http"));
          return {
            host: u.hostname,
            port: parseInt(u.port || "6604", 10) || 6604,
          };
        } catch (e) {
          return null;
        }
      }

      var mode = (qp("mode") || "live").toLowerCase();
      var isPlayback = mode === "playback" || mode === "vod";
      var base = (qp("base") || "").replace(/\/$/, "");
      var jsession = qp("jsession");
      var devIdno = qp("devIdno");
      var channel = parseInt(qp("channel") || "0", 10);
      if (isNaN(channel) || channel < 0) channel = 0;
      // Supplier monitor defaults to sub-stream (1)
      var stream = parseInt(qp("stream") || "1", 10);
      if (isNaN(stream)) stream = 1;
      var title = qp("title") || (isPlayback ? "Playback" : (devIdno + " - CH" + (channel + 1)));
      var mediaHost = qp("mediaHost");
      var mediaPort = parseInt(qp("mediaPort") || "6605", 10) || 6605;
      var vodUrl = qp("url");

      if (!base) {
        setStatus("Missing base URL.");
        return;
      }
      if (isPlayback) {
        if (!vodUrl) {
          setStatus("Missing playback url.");
          return;
        }
        // Use MDVR PlaybackUrlWs directly (ws://media:6604/...). A CMP-side
        // :3104 proxy was tried earlier but is not reachable from clients even
        // though :6604 itself is — forcing the proxy caused persistent black screens.
        var vodEp = parseWsEndpoint(vodUrl);
        if (vodEp) {
          mediaHost = vodEp.host;
          mediaPort = vodEp.port;
        }
        setStatus("Starting playback…");
      } else if (!jsession || !devIdno) {
        setStatus("Missing base, jsession, or devIdno.");
        return;
      }

      if (!mediaHost) {
        try { mediaHost = new URL(base).hostname; }
        catch (e) { setStatus("Invalid MDVR base URL."); return; }
      }
      if (!mediaHost || mediaHost === "localhost") mediaHost = "127.0.0.1";

      // Same-origin proxy keeps player asset paths on this host.
      // Critical: libcmsv6decode.wasm is loaded from site root (/libcmsv6decode.wasm),
      // which is why the supplier page works (file exists on MDVR) but a bare
      // CMP embed stayed black until we mirrored that file under /public.
      var assetBase = "/mdvr-proxy";

      var swfobject = null;
      var started = false;

      // Full viewport for Cmsv6 (incl. rotated fullscreen). Aspect kept via object-fit:contain.
      function size() {
        return {
          width: Math.max(160, window.innerWidth || document.documentElement.clientWidth || 320),
          height: Math.max(120, window.innerHeight || document.documentElement.clientHeight || 180),
        };
      }

      function playerApi() {
        if (!swfobject) return null;
        if (isPlayback) {
          if (typeof swfobject.startVodM === "function" || typeof swfobject.startVod === "function") {
            return swfobject;
          }
        } else if (typeof swfobject.startVideo === "function") {
          return swfobject;
        }
        if (typeof swfobject.getObjectById === "function") {
          var obj = swfobject.getObjectById("cmsv6flash");
          if (!obj) return null;
          if (isPlayback) {
            if (typeof obj.startVodM === "function" || typeof obj.startVod === "function") return obj;
          } else if (typeof obj.startVideo === "function") {
            return obj;
          }
        }
        return null;
      }

      function waitReady(timeoutMs) {
        var deadline = Date.now() + (timeoutMs || 20000);
        return new Promise(function (resolve, reject) {
          (function tick() {
            var api = playerApi();
            if (api && typeof api.setWindowNum === "function") {
              resolve(api);
              return;
            }
            if (Date.now() > deadline) {
              reject(new Error("Player init timeout"));
              return;
            }
            setTimeout(tick, 50);
          })();
        });
      }

      function start(api) {
        try {
          // Match supplier init: create windows then select current count.
          if (typeof api.setWindowNum === "function") {
            try { api.setWindowNum(36); } catch (e1) { /* optional */ }
            api.setWindowNum(1);
          }
          // Live needs setServerInfo. For VOD the PlaybackUrlWs already contains
          // host:port — setting a mismatched server here can leave a black pane.
          if (!isPlayback && typeof api.setServerInfo === "function") {
            api.setServerInfo(mediaHost, mediaPort);
          }
          if (typeof api.setVideoInfo === "function") api.setVideoInfo(0, title);
          if (typeof api.setBufferTime === "function") {
            try { api.setBufferTime(0, 2, 4); } catch (e2) { /* optional */ }
          }

          // Surface player/net errors instead of a silent black pane.
          if (typeof api.addEventListener === "function") {
            try {
              api.addEventListener("onTtxVideoMsg", function (index, type) {
                if (!type) return;
                if (type === "start" || type === "play" || type === "playing") {
                  setStatus("");
                  return;
                }
                if (
                  type === "loadFailure" ||
                  type === "playFailure" ||
                  type === "neterror" ||
                  type === "error"
                ) {
                  setStatus("Playback " + type);
                }
              });
            } catch (eMsg) { /* optional */ }
          }

          if (isPlayback) {
            // Supplier videoExampleH5: stopVodM then startVodM(url, "").
            // Requires isVodMode:true on the Cmsv6Player constructor.
            if (typeof api.stopVodM === "function") {
              try { api.stopVodM(); } catch (e3) { /* optional */ }
            }
            setTimeout(function () {
              try {
                if (typeof api.startVodM === "function") {
                  // "" => single-channel path that keeps PLAYCHN from the WS URL
                  api.startVodM(vodUrl, "");
                } else if (typeof api.startVod === "function") {
                  api.startVod(0, vodUrl);
                } else {
                  throw new Error("Playback API not available");
                }
                started = true;
                // Keep a short hint; device files often buffer ~3s before first frame.
                setStatus("Buffering playback…");
                setTimeout(function () { setStatus(""); }, 5000);
              } catch (err2) {
                setStatus(err2 && err2.message ? err2.message : String(err2));
              }
            }, 200);
            return;
          }

          // Same signature as supplier ttxplayer-h5.js
          setStatus("Connecting stream…");
          api.startVideo(0, jsession, devIdno, channel, stream, true);
          started = true;
          // Do not clear immediately — a silent black pane looks "loaded".
          setTimeout(function () {
            var el = document.getElementById("status");
            if (el && !el.hidden && /Connecting/.test(el.textContent || "")) {
              setStatus("Waiting for video…");
            }
          }, 8000);
        } catch (err) {
          setStatus(err && err.message ? err.message : String(err));
        }
      }

      // Prefer proxied same-origin scripts; fall back to absolute MDVR URLs.
      loadScript(assetBase + "/808gps/js/jquery.min.js")
        .catch(function () { return loadScript(base + "/808gps/js/jquery.min.js"); })
        .then(function () {
          return loadScript(assetBase + "/808gps/js/cmsv6player.min.js")
            .catch(function () { return loadScript(base + "/808gps/js/cmsv6player.min.js"); });
        })
        .then(function () {
          if (typeof Cmsv6Player === "undefined") {
            throw new Error("Cmsv6Player not available");
          }
          var dim = size();
          // Critical: playback requires isVodMode (supplier videoExampleH5.html).
          swfobject = new Cmsv6Player({
            domId: "cmsv6flash",
            width: dim.width,
            height: dim.height,
            lang: "zh-cn",
            isVodMode: !!isPlayback,
          });
          return waitReady(20000);
        })
        .then(start)
        .catch(function (err) {
          setStatus(err && err.message ? err.message : String(err));
        });

      function forceContainPaint() {
        var nodes = document.querySelectorAll("video, canvas");
        for (var i = 0; i < nodes.length; i++) {
          try { nodes[i].style.setProperty("object-fit", "contain", "important"); } catch (e1) { /* optional */ }
        }
      }

      window.addEventListener("resize", function () {
        if (!started) return;
        var api = playerApi();
        if (!api) return;
        var dim = size();
        if (typeof api.resize === "function") {
          try { api.resize(dim.width, dim.height); } catch (e) { /* optional */ }
        }
        forceContainPaint();
      });
      // Keep Cmsv6 fullscreen rotation/fill; only re-apply contain (no crop/stretch).
      function onFs() {
        setTimeout(forceContainPaint, 50);
        setTimeout(forceContainPaint, 250);
      }
      document.addEventListener("fullscreenchange", onFs);
      document.addEventListener("webkitfullscreenchange", onFs);
    })();
  </script>
</body>
</html>
